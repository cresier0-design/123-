name: Linux build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux-x64:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            pkg-config \
            rpm \
            xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Create dummy resource files for build
        run: |
          mkdir -p ../backend/core_engine
          mkdir -p ../DLCUnlocker
          touch ../backend/core_engine/winmm.dll
          touch ../backend/core_engine/winmm_unity.dll
          touch ../backend/core_engine/EpicFix64.dll
          touch ../backend/core_engine/EpicFix.ini
          touch ../backend/core_engine/EOSSDK-Win64-Shipping.dll
          touch ../backend/core_engine/SteamFix64.dll
          touch ../DLCUnlocker/steam_api.dll
          touch ../DLCUnlocker/steam_api64.dll

      - name: Check Linux backend
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build AppImage, DEB and RPM
        run: npm run tauri build -- --bundles appimage,deb,rpm

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
